[package]
name = "rbx-engine"
version = "0.1.0"
edition = "2021"
description = "Two-deck DJ audio engine (own design) for the rekordbox-rs MVP"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "pcm", "wav", "aac", "isomp4", "ogg", "vorbis"] }
cpal = "0.15"

[[bin]]
name = "rbx-play"
path = "src/bin/rbx-play.rs"
